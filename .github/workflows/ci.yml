name: ci

on:
  push:
    branches: [main]
  pull_request:

# The offline suite must stay offline. Anything needing a live chain is opt-in behind FORK=1 and
# runs in a separate job, so an RPC hiccup cannot fail the offline gate.
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # One gate, one definition. CI runs the same script a developer runs, so the two can never
      # drift into disagreeing about what "green" means.
      - name: offline suite
        run: script/test.sh

      - name: no secrets committed
        run: |
          if git grep -nIE "(RELAYER_)?PRIVATE_KEY[[:space:]]*=[[:space:]]*0x[0-9a-fA-F]{64}" -- . ':!*.example'; then
            echo "::error::a private key appears to be committed"
            exit 1
          fi
          echo "clean"

  # Testnet fork proofs. These cover LiquidityDesk, YieldRouter, EquityDesk and V4PoolSeeder, which
  # the offline suite barely touches — a break in them has to be able to fail a pull request.
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run packages/sdk/scripts/gen-fixtures.ts

      - name: router and liquidity forks against the testnets
        env:
          RPC_ETH_SEPOLIA: ${{ secrets.RPC_ETH_SEPOLIA || 'https://ethereum-sepolia-rpc.publicnode.com' }}
          RPC_BASE_SEPOLIA: ${{ secrets.RPC_BASE_SEPOLIA || 'https://base-sepolia-rpc.publicnode.com' }}
          RPC_OP_SEPOLIA: ${{ secrets.RPC_OP_SEPOLIA || 'https://optimism-sepolia-rpc.publicnode.com' }}
        run: cd contracts && FORK=1 forge test --match-path 'test/{Router,Liquidity}Fork.t.sol' -vv

  mainnet-fork:
    runs-on: ubuntu-latest
    # The only fork allowed to fail without blocking a merge: it reads mainnet through a public RPC,
    # so a rate limit here is not a regression. It is never silently skipped.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run packages/sdk/scripts/gen-fixtures.ts

      - name: treasury fork against mainnet
        env:
          RPC_ETH_MAINNET: ${{ secrets.RPC_ETH_MAINNET || 'https://ethereum-rpc.publicnode.com' }}
        run: cd contracts && FORK=1 forge test --match-path 'test/TreasuryFork.t.sol' -vv
